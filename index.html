<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The Meta Refresh handles the instant browser redirect -->
    <meta http-equiv="refresh" content="0; URL=https://kamvasa.com">
    <!-- 2. The Canonical link tells search engines where the true page lives -->
    <link rel="canonical" href="https://kamvasa.com">
  <script>
    window.location.replace("https://kamvasa.com" + window.location.pathname);
</script>
</head>
<body>
    <p></p>
</body>
</html>
